name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Beldsoft.sln

      - name: Build
        run: dotnet build Beldsoft.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Beldsoft.sln --no-build --configuration Release --verbosity normal
        # No test projects yet — this step will succeed with "No test projects found"
        # Add test projects under tests/ and they will be picked up automatically

      - name: Publish web app
        run: >
          dotnet publish src/Beldsoft.Web/Beldsoft.Web.csproj
          --no-build
          --configuration Release
          --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beldsoft-web-${{ github.sha }}
          path: ./publish
          retention-days: 7
